[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevrand"
version = "0.2.0"
description = "Random numbers subject to Jev's approval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
jevrand = "jevrand.cli:main"

[tool.setuptools.packages.find]
include = ["jevrand*"]

[tool.setuptools.package-data]
jevrand = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
